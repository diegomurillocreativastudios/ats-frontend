# Ortografía en código fuente (cadenas UI); rutas sin tilde se ignoran vía cspell.json.
name: Spellcheck

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # cspell 10.x requires Node >= 22.18 (see cspell package engines)
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run spellcheck
