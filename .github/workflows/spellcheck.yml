# Ortografía en código fuente (cadenas UI); rutas sin tilde se ignoran vía cspell.json.
# FE-SEC-017: pin actions to full commit SHA (mutable tags can move).
name: Spellcheck

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # cspell 10.x requires Node >= 22.18 (see cspell package engines)
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run spellcheck
