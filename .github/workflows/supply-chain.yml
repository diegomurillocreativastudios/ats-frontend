# FE-SEC-017: generate a CycloneDX Software Bill of Materials and attest it.
# Fail closed if SBOM generation or attestation fails.
name: Supply Chain

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX Software Bill of Materials
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Upload Software Bill of Materials artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Attest Software Bill of Materials
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: sbom.cdx.json
          sbom-path: sbom.cdx.json
