# Frontend-only repo: build + `next start`; tests call a configured API.
# FE-SEC-008: fail-closed — no default admin/admin or external Render URL.
# FE-SEC-017: pin actions to full commit SHA (mutable tags can move).
name: E2E Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      API_URL: ${{ vars.E2E_API_URL }}
      E2E_DEMO_EMAIL: ${{ secrets.E2E_DEMO_EMAIL }}
      E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Require E2E secrets and API URL
        run: |
          missing=0
          if [ -z "${{ vars.E2E_API_URL }}" ]; then
            echo "::error::Missing repository variable E2E_API_URL"
            missing=1
          fi
          if [ -z "${{ secrets.E2E_DEMO_EMAIL }}" ]; then
            echo "::error::Missing repository secret E2E_DEMO_EMAIL"
            missing=1
          fi
          if [ -z "${{ secrets.E2E_DEMO_PASSWORD }}" ]; then
            echo "::error::Missing repository secret E2E_DEMO_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "FE-SEC-008: CI fails closed without E2E_API_URL, E2E_DEMO_EMAIL, and E2E_DEMO_PASSWORD."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
