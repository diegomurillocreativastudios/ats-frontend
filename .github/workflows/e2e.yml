# Frontend-only repo: build + `next start`; tests call the API on Render.
name: E2E Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'https://backend-7eop.onrender.com' }}
      API_URL: ${{ vars.E2E_API_URL || 'https://backend-7eop.onrender.com' }}
      E2E_DEMO_EMAIL: ${{ secrets.E2E_DEMO_EMAIL || 'admin' }}
      E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD || 'admin' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
